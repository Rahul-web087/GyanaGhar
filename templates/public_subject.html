
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ subject.name }} - {{ cls.name }} | GyanaGhar</title>

    <meta name="description"
          content="Explore {{ subject.name }} chapters and study resources for {{ cls.name }} on GyanaGhar.">

    <meta name="robots" content="index, follow">

    <link rel="canonical" href="{{ request.url }}">
</head>

<body>

    <header>
        <a href="{{ url_for('home') }}">GyanaGhar</a>

        <h1>{{ subject.name }}</h1>

        <p>
            Class: {{ cls.name }}
        </p>

        <p>
            Browse chapters and discover available learning materials.
        </p>
    </header>

    <main>
        <h2>Available Chapters</h2>

        {% for chapter in chapters %}
            <article>
                <h3>{{ chapter.name }}</h3>

                <a href="{{ url_for('public_chapter',
                                    chapter_id=chapter.id) }}">
                    Explore Chapter
                </a>
            </article>
        {% else %}
            <p>No chapters available yet.</p>
        {% endfor %}
    </main>

    <footer>
        <a href="{{ url_for('public_class',
                            class_id=cls.id) }}">
            Back to {{ cls.name }}
        </a>

        |
        <a href="{{ url_for('login') }}">Student Login</a>
    </footer>

</body>
</html>
