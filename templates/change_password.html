{% extends "base.html" %}

{% block title %}
Change Password
{% endblock %}

{% block content %}

<div class="change-password-container">

    <div class="password-card">

        <h2>Change Password</h2>

        <p class="subtitle">
            Update your admin account password
        </p>

        {% if error %}
        <div class="message error">
            {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="message success">
            {{ success }}
        </div>
        {% endif %}

        <form method="POST">

            <div class="form-group">
                <label>Current Password</label>

                <input
                    type="password"
                    name="current_password"
                    placeholder="Enter current password"
                    required
                >
            </div>

            <div class="form-group">
                <label>New Password</label>

                <input
                    type="password"
                    name="new_password"
                    placeholder="Enter new password"
                    minlength="8"
                    required
                >
            </div>

            <div class="form-group">
                <label>Confirm New Password</label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    minlength="8"
                    required
                >
            </div>

            <button type="submit">
                Change Password
            </button>

        </form>

    </div>

</div>

<style>

.change-password-container {
    min-height: 70vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 15px;
}

.password-card {
    width: 100%;
    max-width: 450px;
    background: #ffffff;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.12);
}

.password-card h2 {
    text-align: center;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: 600;
}

.form-group input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    box-sizing: border-box;
}

.form-group input:focus {
    outline: none;
    border-color: #333;
}

.password-card button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #111;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.password-card button:hover {
    opacity: 0.9;
}

.message {
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 18px;
    text-align: center;
}

.error {
    background: #ffe5e5;
    color: #b00020;
}

.success {
    background: #e5f7e9;
    color: #176b2c;
}

@media (max-width: 500px) {

    .password-card {
        padding: 22px;
    }

}

</style>

{% endblock %}
