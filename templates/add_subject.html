
{% extends "base.html" %}

{% block title %}Add Subject | GyanaGhar{% endblock %}

{% block extra_head %}
<style>
    .subject-page {
        max-width: 650px;
        width: 92%;
        margin: 30px auto;
    }

    .back-btn {
        display: inline-block;
        padding: 10px 17px;
        background: #eff6ff;
        color: #1d4ed8;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 22px;
    }

    .back-btn:hover {
        background: #dbeafe;
    }

    .form-card {
        background: #ffffff;
        padding: 30px;
        border-radius: 16px;
        border: 1px solid #e2e8f0;
        box-shadow: 0 8px 25px rgba(15,23,42,0.06);
        animation: fadeUp 0.5s ease;
    }

    .form-card h2 {
        margin: 0 0 25px;
        color: #173b70;
        font-size: 24px;
        text-align: center;
    }

    .form-card label {
        display: block;
        margin: 15px 0 8px;
        color: #334155;
        font-size: 14px;
        font-weight: 600;
    }

    .form-card input,
    .form-card select {
        width: 100%;
        padding: 13px 14px;
        border-radius: 9px;
        border: 1px solid #dbe3ef;
        background: #f8fafc;
        color: #1e293b;
        font-size: 15px;
        box-sizing: border-box;
    }

    .form-card input:focus,
    .form-card select:focus {
        border-color: #2563eb;
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
        outline: none;
    }

    .form-card button {
        width: 100%;
        margin-top: 24px;
        padding: 14px;
        border-radius: 9px;
        background: #2563eb;
        color: white;
        font-size: 16px;
        font-weight: 600;
        border: none;
        cursor: pointer;
        transition: 0.2s;
    }

    .form-card button:hover {
        background: #1d4ed8;
        transform: translateY(-2px);
    }

    @keyframes fadeUp {
        from {
            opacity: 0;
            transform: translateY(25px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media(max-width: 600px) {
        .form-card {
            padding: 22px 18px;
        }

        .form-card h2 {
            font-size: 21px;
        }
    }
</style>
{% endblock %}


{% block content %}

<div class="subject-page">

    <!-- BACK BUTTON -->
    <a href="/dashboard" class="back-btn">
        ← Back to Dashboard
    </a>

    <!-- FORM -->
    <div class="form-card">

        <h2>📚 Add New Subject</h2>

        <form method="POST">

            <label for="class_id">Select Class</label>

            <select name="class_id" id="class_id" required>

                <option value="">Choose a Class</option>

                {% for c in classes %}
                    <option value="{{ c.id }}">{{ c.name }}</option>
                {% endfor %}

            </select>

            <label for="subject_name">Subject Name</label>

            <input
                type="text"
                name="name"
                id="subject_name"
                placeholder="Example: Mathematics"
                required
            >

            <button type="submit">
                <i class="fas fa-plus-circle"></i>
                Add Subject
            </button>

        </form>

    </div>

</div>

{% endblock %}
